name: update-prices

on:
  schedule:
    # 日本時間 16:00（日本株の引け後）と 翌6:30（米国株の引け後）。GitHubの時刻はUTCなので9時間引いて書く。
    - cron: "0 7 * * 1-5"
    - cron: "30 21 * * 0-4"
  workflow_dispatch:   # 手動実行ボタン用

permissions:
  contents: write      # prices.json をコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "update prices"
          git push
